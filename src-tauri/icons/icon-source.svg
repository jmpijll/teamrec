<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6264A7"/>
      <stop offset="100%" stop-color="#464EB8"/>
    </linearGradient>
    <linearGradient id="mic" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E6E3"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Inner subtle glow -->
  <rect x="40" y="40" width="944" height="944" rx="190" ry="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Microphone body -->
  <rect x="412" y="220" width="200" height="340" rx="100" ry="100" fill="url(#mic)"/>
  <!-- Microphone stand arc -->
  <path d="M 340 460 Q 340 660 512 660 Q 684 660 684 460" fill="none" stroke="white" stroke-width="42" stroke-linecap="round"/>
  <!-- Microphone stand vertical -->
  <line x1="512" y1="660" x2="512" y2="760" stroke="white" stroke-width="42" stroke-linecap="round"/>
  <!-- Microphone base -->
  <line x1="400" y1="760" x2="624" y2="760" stroke="white" stroke-width="42" stroke-linecap="round"/>
  <!-- Record indicator dot (Teams red) -->
  <circle cx="770" cy="260" r="80" fill="#C4314B"/>
  <circle cx="770" cy="260" r="50" fill="#E8445A"/>
</svg>
